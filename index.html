<title>Bottle Notes</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column, like a notebook. Cellar list is home; Scan, Review, Save is a single forward path; wine pages hold the tastings. */
:root{
  --bg:#F5F2F4; --surface:#FFFFFF; --surface-2:#ECE6EA; --field:#FBF9FA;
  --ink:#231A21; --muted:#6A5E67; --line:#DAD2D8;
  --accent:#7B1E3B; --accent-ink:#FFFFFF; --accent-soft:#F1DFE5;
  --ok:#2B6A4C; --ok-soft:#DDEFE5;
  --warn:#8A5208; --warn-soft:#F7E8CF;
  --info:#385888; --info-soft:#E1E8F4;
  --danger:#A12A2A;
  --font-display:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17111A; --surface:#211823; --surface-2:#2D2331; --field:#1B141E;
    --ink:#F1E9EE; --muted:#A99BA6; --line:#3B2F40;
    --accent:#E27896; --accent-ink:#1B0C13; --accent-soft:#3A1D29;
    --ok:#78D3A3; --ok-soft:#1D3A2D;
    --warn:#E7B563; --warn-soft:#3B2D14;
    --info:#9DB8EA; --info-soft:#1F2B44;
    --danger:#FF8F8F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17111A; --surface:#211823; --surface-2:#2D2331; --field:#1B141E;
  --ink:#F1E9EE; --muted:#A99BA6; --line:#3B2F40;
  --accent:#E27896; --accent-ink:#1B0C13; --accent-soft:#3A1D29;
  --ok:#78D3A3; --ok-soft:#1D3A2D;
  --warn:#E7B563; --warn-soft:#3B2D14;
  --info:#9DB8EA; --info-soft:#1F2B44;
  --danger:#FF8F8F;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 15px/1.5 var(--font-body);
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
h1,h2,h3,p,ul,dl{margin:0}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font:500 36px/1.05 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
h1.h2{font-size:28px;line-height:1.1}
.h3{font:600 16px/1.3 var(--font-body)}
.sub{color:var(--muted);font:400 12px var(--font-mono);margin-top:8px}
.muted{color:var(--muted);font-size:14px}
.tiny{font:500 11px var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.btn{font:600 15px var(--font-body);padding:11px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08);border-color:var(--accent)}
.btn-ghost{background:transparent}
.wide{width:100%}
.back{background:none;border:0;padding:6px 0;color:var(--muted);font:500 14px var(--font-body);cursor:pointer;align-self:flex-start;min-height:36px}
.back:hover{color:var(--ink)}
.link{background:none;border:0;color:var(--muted);font:500 13px var(--font-body);padding:6px 0;cursor:pointer;align-self:flex-start;text-decoration:underline;min-height:32px}
.link.danger{color:var(--danger)}
.trow{display:flex;gap:8px;flex-wrap:wrap}

.demo{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted)}
.notice{background:var(--warn-soft);padding:10px 12px;border-radius:8px;font-size:14px}
.dup{border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}

input,select,textarea{
  width:100%; font:400 16px/1.4 var(--font-body); color:var(--ink);
  background:var(--field); border:1px solid var(--line); border-radius:6px; padding:10px 12px; min-height:44px;
}
textarea{resize:vertical;min-height:84px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.searchbar input{padding:12px 14px}
#results{width:100%;padding-left:0;padding-right:0;box-sizing:border-box}
#results>*{width:100%;box-sizing:border-box}
.menurow{all:unset;display:block;width:100%;cursor:pointer;box-sizing:border-box}
.shelf{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.shbtn{flex:1;border:0;background:transparent;color:var(--ink);padding:9px 3px;border-radius:9px;font:600 13px var(--font-body);cursor:pointer;min-height:40px}
.shbtn.on{background:var(--ink);color:var(--bg,#fff)}
.wtag{font:600 11px var(--font-body);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.sfbar{display:flex;gap:8px;align-items:center}
.sfbar .srt{flex:1;min-width:0;min-height:44px}
.sfbar .btn.on{border-color:var(--accent);color:var(--accent)}
.fpanel{padding:14px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:999px;font:500 14px var(--font-body);cursor:pointer;min-height:36px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.count-line{font:400 12px var(--font-mono);color:var(--muted)}

.list{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.row{width:100%;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;color:inherit;font:inherit}
.row:hover{border-color:var(--muted)}
.thumb{width:52px;height:68px;border-radius:6px;overflow:hidden;background:var(--surface-2);position:relative;display:grid;place-items:center;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .dot{position:absolute;right:4px;bottom:4px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--c);box-shadow:0 0 0 1.5px var(--surface-2)}
.dot-red{--c:#7B1E3B}.dot-white{--c:#D9C56B}.dot-rose{--c:#E58FA3}.dot-sparkling{--c:#9FC3CF}.dot-orange{--c:#D98A3D}.dot-dessert{--c:#C79A2B}
.rbody{display:flex;flex-direction:column;gap:1px;min-width:0}
.rname{font:500 17px/1.2 var(--font-display);overflow-wrap:anywhere}
.rmeta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.rwhere{font:400 12px var(--font-mono);color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.rside{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.avg{font:500 16px var(--font-mono);color:var(--accent)}
.avg i{font-style:normal;margin-left:2px}
.avg.none{color:var(--muted)}
.rcount{font:400 11px var(--font-mono);color:var(--muted);white-space:nowrap}
.ex{font:500 10px var(--font-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);padding:1px 5px;border-radius:4px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px 16px;text-align:center;color:var(--muted)}
.etitle{font:500 20px var(--font-display);color:var(--ink);margin-bottom:4px}
.hbtns{display:flex;gap:8px;align-items:center}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;padding:0}
.iconbtn:hover{border-color:var(--accent)}
.tlist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.tbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-family:var(--font-body);min-height:44px}
.tbtn:hover{border-color:var(--accent)}
.tbtn:disabled{opacity:.6;cursor:default}
.ttitle{font-weight:600;font-size:15px}
.tsub{font-size:13px;color:var(--muted)}
textarea.csv{font:12px/1.4 var(--font-mono);min-height:120px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.flabel{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:500}
.count{font:400 11px var(--font-mono)}
.tag{font:500 10.5px var(--font-mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:4px;white-space:nowrap}
.tag-label{color:var(--ok);background:var(--ok-soft)}
.tag-researched,.tag-inferred{color:var(--warn);background:var(--warn-soft)}

.drop{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;text-align:center;border:1.5px dashed var(--accent);border-radius:10px;padding:34px 16px;cursor:pointer;background:var(--accent-soft)}

.dtitle{font:500 21px var(--font-display)}
.dsub{font-size:13px;color:var(--muted)}

.actions{display:flex;flex-direction:column;gap:8px}

.bar{width:100%;height:3px;background:var(--line);border-radius:2px;position:relative;overflow:hidden}
.bar::after{content:"";position:absolute;inset:0 auto 0 0;width:35%;background:var(--accent);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}

.mlist{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}

.mhead{display:flex;flex-direction:column;min-width:0}

<script>
(function(){
'use strict';
var KEY='bottle-notes-demo-v1';
var app=document.getElementById('app');

var TYPES=['red','white','rosé','sparkling','orange','dessert'];
var TYPE_LABEL={red:'Red',white:'White','rosé':'Rosé',sparkling:'Sparkling',orange:'Orange',dessert:'Dessert'};
var TYPE_CLS={red:'red',white:'white','rosé':'rose',sparkling:'sparkling',orange:'orange',dessert:'dessert'};
var TAG_TXT={unsure:'Check this',label:'On label',researched:'Researched',inferred:'From region',edited:'Edited',manual:'Added by you',none:'Not on label'};

var FIELDS=[
  {k:'name',l:'Wine name',w:'full',ph:'e.g. Chianti Classico Riserva'},
  {k:'producer',l:'Producer',w:'full',ph:'Winery or estate'},
  {k:'vintage',l:'Vintage',ph:'2019 or NV'},
  {k:'type',l:'Type',sel:true},
  {k:'grapes',l:'Grapes',w:'full',ph:'Separate with commas'},
  {k:'country',l:'Country'},
  {k:'region',l:'Region'},
  {k:'appellation',l:'Appellation',w:'full',ph:'e.g. DOCG, AOC, DO'},
  {k:'abv',l:'Alcohol %',mode:'decimal',ph:'13.5'},
  {k:'volume',l:'Volume (ml)',mode:'numeric',ph:'750'}
];
var FIELD_KEYS=FIELDS.map(function(f){return f.k;});

/* ---- Demo data: made-up bottles standing in for what the label reader will return ---- */
var SAMPLES=[
  {key:'chianti',name:'Chianti Classico Riserva',producer:'Castello di Montebruna',vintage:'2019',type:'red',grapes:'',country:'Italy',region:'Tuscany',appellation:'Chianti Classico DOCG',abv:'13.5',volume:'750'},
  {key:'barolo',name:'Barolo',producer:'Cantina Serralunga Vecchia',vintage:'2017',type:'red',grapes:'Nebbiolo',country:'Italy',region:'Piedmont',appellation:'Barolo DOCG',abv:'14.5',volume:'750'},
  {key:'napa',name:'Cabernet Sauvignon Estate',producer:'Stag Ridge Cellars',vintage:'2020',type:'red',grapes:'Cabernet Sauvignon, Merlot',country:'United States',region:'California',appellation:'Napa Valley AVA',abv:'14.8',volume:'750'},
  {key:'champagne',name:'Brut Nature',producer:'Maison Delacourt',vintage:'NV',type:'sparkling',grapes:'',country:'France',region:'Champagne',appellation:'Champagne AOC',abv:'12.0',volume:'750'},
  {key:'rioja',name:'Rioja Reserva',producer:'Bodegas Valdeolmo',vintage:'2018',type:'red',grapes:'Tempranillo, Graciano',country:'Spain',region:'La Rioja',appellation:'DOCa Rioja',abv:'14.0',volume:'750'},
  {key:'sancerre',name:'Sancerre Les Grands Champs',producer:'Domaine du Pré Fleuri',vintage:'2022',type:'white',grapes:'',country:'France',region:'Loire Valley',appellation:'Sancerre AOC',abv:'12.5',volume:'750'},
  {key:'albarino',name:'Albariño',producer:'Pazo de Aldea Vella',vintage:'2023',type:'white',grapes:'Albariño',country:'Spain',region:'Galicia',appellation:'DO Rías Baixas',abv:'12.5',volume:'750'}
];
var RESEARCH={
  chianti:{grapes:'Sangiovese, Canaiolo',producer:'Family estate in the Chianti Classico zone, farming hillside vineyards.',style:'Medium to full body, red cherry and dried herbs, firm tannins, bright acidity.',drink:'Now to 2031',price:'$28 to $40'},
  barolo:{grapes:'Nebbiolo',producer:'Small cellar in the Serralunga d’Alba area of the Langhe.',style:'Tar and rose, sour cherry, high tannin and acidity. Needs air or time.',drink:'2027 to 2042',price:'$55 to $90'},
  napa:{grapes:'Cabernet Sauvignon, Merlot',producer:'Estate winery on the hillsides east of the Napa Valley floor.',style:'Ripe blackcurrant, cedar, firm structure, plush finish.',drink:'Now to 2032',price:'$45 to $75'},
  champagne:{grapes:'Chardonnay, Pinot Noir, Pinot Meunier',producer:'Grower-style house making zero-dosage cuvées.',style:'Very dry, chalky, green apple and brioche, fine bubbles.',drink:'Now to 2030',price:'$45 to $70'},
  rioja:{grapes:'Tempranillo, Graciano',producer:'Traditional bodega aging wines in American and French oak.',style:'Dried cherry, vanilla, tobacco, soft tannins. Reserva rules require at least three years of aging in total.',drink:'Now to 2032',price:'$18 to $28'},
  sancerre:{grapes:'Sauvignon Blanc',producer:'Family domaine on limestone and flint soils near the Loire.',style:'Dry and crisp, citrus, green apple and a flinty edge.',drink:'Now to 2027',price:'$25 to $38'},
  albarino:{grapes:'Albariño',producer:'Pazo-style estate close to the Atlantic coast.',style:'Peach and lemon, salty finish, lively acidity. Good with seafood.',drink:'Now to 2026',price:'$16 to $26'}
};

/* ---- Small helpers ---- */
var S={wines:[],view:'list',q:'',type:'all',sel:null,draft:null,photos:[],full:[],pass:'',scanning:false,tok:0,looking:false,sampleIdx:0,dup:null,nt:null,addOpen:false,confirm:'',csv:'',lastTaster:'',warned:false,cloud:'loading',user:null,a:{email:'',pw:'',mode:'in',err:'',busy:false,info:''},importLocal:null,sort:'added',shelf:'cellar',scanMode:'label',menu:null,menuPlace:'',f:{country:'',region:'',grape:'',rating:0,tasted:''},fOpen:false};
try{var _v=JSON.parse(localStorage.getItem('bottle-notes-view-v1')||'null');if(_v){if(typeof _v.sort==='string')S.sort=_v.sort;if(_v.shelf==='want'||_v.shelf==='coll')S.shelf=_v.shelf;if(_v.f&&typeof _v.f==='object')Object.keys(S.f).forEach(function(k){if(_v.f[k]!==undefined)S.f[k]=_v.f[k];});}}catch(e){}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36);}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){if(!s)return 'Date not noted';var p=s.split('-');if(p.length!==3)return s;var d=new Date(+p[0],+p[1]-1,+p[2]);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}
function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function pick(o,ks){var r={};ks.forEach(function(k){r[k]=o[k]||'';});return r;}
function blankTasting(){return {where:'',date:today(),taster:S.lastTaster||'',rating:0,price:'',notes:''};}
function hasTasting(t){return !!((t.where||'').trim()||(t.notes||'').trim()||t.rating||String(t.price||'').trim());}
function getSel(){return S.wines.find(function(w){return w.id===S.sel;});}
function avgRating(w){var r=w.tastings.map(function(t){return t.rating;}).filter(Boolean);if(!r.length)return 0;return r.reduce(function(a,b){return a+b;},0)/r.length;}
function sortedTastings(w){return w.tastings.slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});}
function lastTasting(w){return sortedTastings(w)[0];}

var toastTimer;
function toast(m,ms){var el=document.getElementById('toast');el.textContent=m;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.hidden=true;},ms||2600);}

function persist(){
  if(C.on){cloudSync();return;}
  try{localStorage.setItem(KEY,JSON.stringify(S.wines));}
  catch(e){if(!S.warned){S.warned=true;toast('This browser would not save. Your cellar lasts until you close the page.');}}
}

function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max)return max+1;
  var prev=[],j,i;
  for(j=0;j<=b.length;j++)prev[j]=j;
  for(i=1;i<=a.length;i++){
    var cur=[i],rowMin=i;
    for(j=1;j<=b.length;j++){
      var c=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      cur[j]=c;if(c<rowMin)rowMin=c;
    }
    if(rowMin>max)return max+1;
    prev=cur;
  }
  return prev[b.length];
}
function hay(w){
  var parts=[w.name,w.producer,w.vintage,w.type,w.grapes,w.country,w.region,w.appellation,w.notes];
  w.tastings.forEach(function(t){parts.push(t.where,t.taster,t.notes);});
  return norm(parts.join(' '));
}
/* Words that mean the same thing in different languages, so Italia finds Italy and rosso finds red.
   Written without accents; underscores stand for spaces. */
var COUNTRY_GROUPS=[
  'italy italia italie italien','spain espana spagna espagne spanien','france francia frankreich','germany germania deutschland alemania allemagne',
  'portugal portogallo','austria osterreich autriche','switzerland svizzera suisse schweiz suiza','greece grecia grece',
  'united_states usa estados_unidos stati_uniti etats_unis','south_africa sudafrica afrique_du_sud','new_zealand nuova_zelanda nueva_zelanda nouvelle_zelande',
  'chile cile','hungary ungheria hungria ungarn hongrie','croatia croazia croacia','lebanon libano','turkey turchia turquia turquie'
].map(function(g){return g.split(' ');});
var ALIAS_GROUPS=COUNTRY_GROUPS.concat([
  /* wine types */
  'red rosso tinto rouge rot','white bianco blanco blanc weiss branco','rose rosato rosado','sparkling spumante frizzante espumoso mousseux sekt champagne prosecco cava cremant',
  'orange arancione','dessert passito dulce',
  /* regions */
  'tuscany toscana toscane toskana','piedmont piemonte piemont','sicily sicilia sicile sizilien','lombardy lombardia lombardei','apulia puglia pouilles',
  'sardinia sardegna sardaigne cerdena','burgundy bourgogne borgogna borgona burgund','provence provenza','alsace alsazia elsass',
  'catalonia catalunya cataluna catalogna','andalusia andalucia andalusien','liguria ligurie','lazio latium','castile castilla castiglia',
  'basque_country pais_vasco paesi_baschi','canary_islands canarias islas_canarias canarie isole_canarie','balearic_islands baleares islas_baleares baleari',
  'south_tyrol alto_adige sudtirol','moselle mosel mosella','rhone rodano','rhine rheinhessen reno rhein',
  /* grapes */
  'grenache garnacha','syrah shiraz','mourvedre monastrell mataro','pinot_gris pinot_grigio grauburgunder','pinot_noir pinot_nero spatburgunder',
  'pinot_blanc pinot_bianco weissburgunder','muscat moscato moscatel','trebbiano ugni_blanc','vermentino rolle'
].map(function(g){return g.split(' ');}));
var ALIAS={};
ALIAS_GROUPS.forEach(function(g){g.forEach(function(t){ALIAS[t]=g;});});
var ALIAS_PHRASES=Object.keys(ALIAS).filter(function(k){return k.indexOf('_')!==-1;});

function queryTokens(q){
  var t=' '+norm(q).replace(/[^a-z0-9]+/g,' ').trim()+' ';
  ALIAS_PHRASES.forEach(function(k){t=t.split(' '+k.replace(/_/g,' ')+' ').join(' '+k+' ');});
  return t.split(' ').filter(Boolean);
}
function wordMatch(words,H,alt){
  alt=alt.replace(/_/g,' ');
  if(alt.indexOf(' ')!==-1)return (' '+H+' ').indexOf(' '+alt+' ')!==-1;
  return words.some(function(x){return x===alt||(alt.length>=4&&x.indexOf(alt)===0);});
}
function score(w,q){
  var words=hay(w).split(/[^a-z0-9]+/).filter(Boolean);
  var H=words.join(' ');
  var total=0,toks=queryTokens(q);
  for(var i=0;i<toks.length;i++){
    var tok=toks[i],plain=tok.replace(/_/g,' ');
    if(H.indexOf(plain)!==-1){total+=2;continue;}
    var group=ALIAS[tok];
    if(group&&group.some(function(a){return wordMatch(words,H,a);})){total+=2;continue;}
    var lim=plain.length>=7?2:(plain.length>=4?1:0);
    var ok=lim>0&&words.some(function(x){return lev(x,plain,lim)<=lim;});
    if(ok){total+=1;continue;}
    return 0;
  }
  return total;
}
function findDup(d){
  var k=function(x){return norm(x).replace(/[^a-z0-9]/g,'');};
  return S.wines.find(function(w){return k(w.name)===k(d.name)&&k(w.producer)===k(d.producer)&&k(w.vintage)===k(d.vintage);});
}

/* ---- Seed examples ---- */
function seeds(){
  var day=86400000;
  function mk(key,ts,researched,ago){
    var s=SAMPLES.filter(function(x){return x.key===key;})[0];
    var src={};FIELD_KEYS.forEach(function(k){src[k]=s[k]?'label':'none';});
    var w=pick(s,FIELD_KEYS);
    var res=null;
    if(researched){
      var r=RESEARCH[key];
      if(!w.grapes){w.grapes=r.grapes;src.grapes='researched';}
      res={producer:r.producer,style:r.style,drink:r.drink,price:r.price};
    }
    w.id=uid();w.src=src;w.photos=[];w.notes='';w.sampleKey=key;w.research=res;w.example=true;
    w.added=Date.now()-ago*day;
    w.tastings=ts.map(function(t){var o={id:uid()};for(var k in t)o[k]=t[k];return o;});
    return w;
  }
  return [
    mk('albarino',[{where:'Seaside lunch',date:'2026-08-14',taster:'Me',rating:3,notes:'Crisp and salty. Better with the clams than on its own.',price:'18'}],true,35),
    mk('sancerre',[{where:'Wine bar downtown',date:'2026-09-12',taster:'Me',rating:4,notes:'Citrus and wet stone. Very clean finish.',price:'14 a glass'}],true,20),
    mk('rioja',[
      {where:'Home, Sunday dinner',date:'2026-09-06',taster:'Me',rating:4,notes:'Dark cherry, vanilla, soft tannins. Good with roast chicken.',price:'24'},
      {where:'Birthday dinner',date:'2026-09-20',taster:'Guest',rating:5,notes:'Smooth and warm. Would drink again.',price:''}
    ],false,8)
  ];
}

/* ---- Views ---- */
function tagHtml(k,d){var s=(d.src&&d.src[k])||'none';return '<span class="tag tag-'+s+'" data-tag="'+k+'">'+TAG_TXT[s]+'</span>';}
function dot(type){return '<i class="dot dot-'+(TYPE_CLS[type]||'red')+'"></i>';}
var NOPREVIEW='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128"><rect width="96" height="128" fill="#8a7f87"/><text x="48" y="68" text-anchor="middle" font-size="13" fill="#fff" font-family="sans-serif">Photo</text></svg>');
var BOTTLE='<svg viewBox="0 0 24 40" width="20" height="34" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 2h4v8c0 2 4 4 4 9v17a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V19c0-5 4-7 4-9V2z"/><rect x="7" y="22" width="10" height="8" rx="1"/></svg>';

function thumb(w){
  if(w.photos&&w.photos[0])return '<span class="thumb"><img src="'+w.photos[0]+'" alt="">'+dot(w.type)+'</span>';
  return '<span class="thumb">'+BOTTLE+dot(w.type)+'</span>';
}
function starsPick(target,val){
  var out='<div class="stars" role="group" aria-label="Rating">';
  for(var n=1;n<=5;n++){
    out+='<button type="button" class="star'+(n<=val?' on':'')+'" data-act="rate" data-target="'+target+'" data-val="'+n+'" aria-label="'+n+' of 5" aria-pressed="'+(n===val)+'">★</button>';
  }
  return out+'</div>';
}
function starsShow(v){return '<span class="stars-ro" role="img" aria-label="'+v+' of 5">'+'★'.repeat(v)+'<span class="off">'+'★'.repeat(5-v)+'</span></span>';}

function fieldHtml(f,d){

/* ---- Sort and filter ---- */
var SORTS=[['added','Recently added'],['tasted','Last tasted'],['rating','Highest rated'],['name','Name A to Z'],['producer','Producer A to Z'],['vintage-new','Vintage, newest first'],['vintage-old','Vintage, oldest first']];
function saveView(){try{localStorage.setItem('bottle-notes-view-v1',JSON.stringify({sort:S.sort,shelf:S.shelf,f:S.f}));}catch(e){}}
function regionKey(v){var k=norm(v).trim().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''),g=ALIAS[k];return g?g[0]:k;}
function countryOf(w){return impCountry(w.country);}
function grapesOf(w){
  return String(w.grapes||'').split(/[,;\/&]|\s+e\s+|\s+and\s+|\s+y\s+/i).map(function(g){return g.replace(/\d+\s*%/g,'').replace(/\s+/g,' ').trim();}).filter(Boolean);
}
function grapeKey(g){var k=norm(g).trim().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''),a=ALIAS[k];return a?a[0]:k;}
function filterCount(){var f=S.f,n=0;if(f.country)n++;if(f.region)n++;if(f.grape)n++;if(f.rating)n++;if(f.tasted)n++;return n;}
function passes(w){
  var f=S.f;
  if(f.country&&norm(countryOf(w))!==norm(f.country))return false;
  if(f.region&&regionKey(w.region)!==f.region)return false;
  if(f.grape&&!grapesOf(w).some(function(g){return grapeKey(g)===f.grape;}))return false;
  if(f.rating&&avgRating(w)<f.rating)return false;
  if(f.tasted==='yes'&&!w.tastings.length)return false;
  if(f.tasted==='no'&&w.tastings.length)return false;
  return true;
}
/* Choices for the filter lists come from the wines you have, so there are never empty options. */
function filterOptions(){
  var countries={},regions={},grapes={};
  S.wines.forEach(function(w){
    var c=countryOf(w);if(c)countries[norm(c)]=countries[norm(c)]||c;
  });
  S.wines.forEach(function(w){
    if(S.f.country&&norm(countryOf(w))!==norm(S.f.country))return;
    var r=(w.region||'').trim();if(r){var k=regionKey(r);if(!regions[k])regions[k]=r;}
  });
  S.wines.forEach(function(w){grapesOf(w).forEach(function(g){var k=grapeKey(g);if(k&&!grapes[k])grapes[k]=g;});});
  var list=function(o){return Object.keys(o).map(function(k){return [k,o[k]];}).sort(function(a,b){return norm(a[1]).localeCompare(norm(b[1]));});};
  return {countries:list(countries),regions:list(regions),grapes:list(grapes)};
}
function cmpText(a,b){return norm(a||'').localeCompare(norm(b||''),undefined,{numeric:true,sensitivity:'base'});}
function vintageNum(w){var m=/^(19|20)\d{2}$/.exec(String(w.vintage||'').trim());return m?+m[0]:0;}
function sorter(mode){
  var tie=function(a,b){return (b.added||0)-(a.added||0);};
  switch(mode){
    case 'tasted':return function(a,b){var x=lastTasting(a),y=lastTasting(b),dx=(x&&x.date)||'',dy=(y&&y.date)||'';if(!dx&&!dy)return tie(a,b);if(!dx)return 1;if(!dy)return -1;return dy.localeCompare(dx)||tie(a,b);};
    case 'rating':return function(a,b){var x=avgRating(a),y=avgRating(b);if(!x&&!y)return tie(a,b);if(!x)return 1;if(!y)return -1;return y-x||tie(a,b);};
    case 'name':return function(a,b){return cmpText(a.name,b.name)||tie(a,b);};
    case 'producer':return function(a,b){var x=a.producer||'',y=b.producer||'';if(!x&&!y)return cmpText(a.name,b.name);if(!x)return 1;if(!y)return -1;return cmpText(x,y)||cmpText(a.name,b.name);};
    case 'vintage-new':return function(a,b){var x=vintageNum(a),y=vintageNum(b);if(!x&&!y)return tie(a,b);if(!x)return 1;if(!y)return -1;return y-x||tie(a,b);};
    case 'vintage-old':return function(a,b){var x=vintageNum(a),y=vintageNum(b);if(!x&&!y)return tie(a,b);if(!x)return 1;if(!y)return -1;return x-y||tie(a,b);};
    default:return tie;
  }
}
function isWant(w){return w.status==='want';}
function qtyOf(w){var n=parseInt(w.qty,10);return n>0?Math.min(n,9999):0;}
function clampQty(v){var n=parseInt(v,10);return n>0?Math.min(n,999):1;}
function bottlesText(n){return n+(n===1?' bottle':' bottles');}
function shelfOf(w,sh){
  if(sh==='want')return isWant(w);
  if(isWant(w))return false;
  if(sh==='coll')return qtyOf(w)>0;
  return (w.tastings&&w.tastings.length>0)||qtyOf(w)===0;
}
function shelfWines(){return S.wines.filter(function(w){return shelfOf(w,S.shelf);});}
function subLine(){
  var ws=shelfWines(),n=ws.length;
  if(S.shelf==='coll'){var b=ws.reduce(function(a,w){return a+qtyOf(w);},0);return n+(n===1?' wine':' wines')+' · '+bottlesText(b);}
  if(S.shelf==='want')return n+(n===1?' wine':' wines')+' to try';
  var t=ws.reduce(function(a,w){return a+w.tastings.length;},0);
  return n+(n===1?' wine':' wines')+' · '+t+(t===1?' tasting':' tastings');
}
function shelfBar(){
  var cw=S.wines.filter(function(w){return shelfOf(w,'coll');}),bottles=cw.reduce(function(a,w){return a+qtyOf(w);},0);
  var jn=S.wines.filter(function(w){return shelfOf(w,'cellar');}).length,wn=S.wines.filter(function(w){return isWant(w);}).length;
  var b=function(v,label){return '<button class="shbtn'+(S.shelf===v?' on':'')+'" data-act="shelf" data-v="'+v+'" aria-pressed="'+(S.shelf===v)+'">'+label+'</button>';};
  return '<div class="shelf" role="group" aria-label="Which list">'+b('coll','Collection ('+bottles+')')+b('cellar','Journal ('+jn+')')+b('want','Want to try ('+wn+')')+'</div>';
}
function filtered(){
  var ws=shelfWines().filter(function(w){return (S.type==='all'||w.type===S.type)&&passes(w);});
  if(S.q.trim()){
    var ranked=ws.map(function(w){return [w,score(w,S.q)];}).filter(function(x){return x[1]>0;});
    /* With a search, best match first, unless a sort has been chosen on purpose. */
    if(S.sort==='added')ranked.sort(function(a,b){return b[1]-a[1]||b[0].added-a[0].added;});
    else{var cmp=sorter(S.sort);ranked.sort(function(a,b){return cmp(a[0],b[0]);});}
    return ranked.map(function(x){return x[0];});
  }
  return ws.slice().sort(sorter(S.sort));
}

function render(keep){

  if(S.cloud==='loading'){app.innerHTML='<div class="wrap"><h1>Bottle Notes</h1><p class="muted" role="status">Loading…</p></div>';return;}
  if(S.cloud==='auth'){app.innerHTML=authView();return;}
  if(S.cloud==='error'){app.innerHTML=errorView();return;}
  if(S.view==='scan')html=scanView();
  else if(S.view==='review'&&S.draft)html=reviewView();
  else if(S.view==='detail')html=detailView();
  else if(S.view==='menu'&&S.menu)html=menuView();
  else if(S.view==='drink'&&S.drink)html=drinkView();
  else if(S.view==='import')html=importView();
  else if(S.view==='tools')html=toolsView();

/* ---- Back button ----
   Every screen change is recorded in the browser history, so the phone's Back button steps back through the app
   instead of leaving it. VS lists the screen at each history position, HI is the current position. */
var VS=['list'],HI=0,TRANSIENT={scan:1,review:1};
try{history.replaceState({k:0},'');}catch(e){}
function histReset(){VS=['list'];HI=0;try{history.replaceState({k:0},'');}catch(e){}}
function leaveClean(){S.tok++;S.scanning=false;S.draft=null;clearPhotos();S.dup=null;S.addOpen=false;S.imp=null;}
function nav(v){
  var cur=S.view;
  S.confirm='';S.lb=null;
  try{
    if(v==='list'&&HI>0){var n=HI;HI=0;VS=['list'];history.go(-n);}
    else if(HI>0&&VS[HI-1]===v){HI--;VS.length=HI+1;history.back();}
    else if(v!==cur){
      if(TRANSIENT[cur]&&HI>0){VS[HI]=v;history.replaceState({k:HI},'');}
      else{HI++;VS.length=HI;VS[HI]=v;history.pushState({k:HI},'');}
    }
  }catch(e){}
  S.view=v;render(false);window.scrollTo(0,0);
}
function closeLb(){
  if(history.state&&history.state.lb){history.back();return;}
  S.lb=null;S.confirm='';render(true);
}
window.addEventListener('popstate',function(e){
  var st=e.state||{k:0};
  if(S.lb){if(!st.lb){S.lb=null;S.confirm='';render(true);}return;}
  if(st.lb)return;
  HI=st.k||0;
  var v=VS[HI];
  if(!v){HI=0;v='list';}
  if(v==='detail'&&!getSel())v='list';
  if(v==='review'&&!S.draft)v='list';
  if(v==='import'&&!S.imp)v='list';
  if(v===S.view)return;
  if(TRANSIENT[S.view]||S.view==='import'||v==='list')leaveClean();
  S.view=v;S.confirm='';render(false);window.scrollTo(0,0);
});

/* ---- Photos and the stubbed scan ---- */
function shrink(file,max,q){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=rej;
    fr.onload=function(){
      var im=new Image();
      im.onerror=rej;
      im.onload=function(){
        var k=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',q));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function clearPhotos(){S.photos=[];S.full=[];}
function onPhoto(input){
  var f=input.files&&input.files[0];
  if(!f||S.photos.length>=3)return;
  Promise.all([shrink(f,520,0.72),S.scanMode==='menu'?shrink(f,1800,0.75):shrink(f,1400,0.8)]).then(function(r){S.photos.push(r[0]);S.full.push(r[1]);input.value='';render(true);toast('Photo added.');})
    .catch(function(){S.photos.push(NOPREVIEW);S.full.push(null);input.value='';render(true);toast('Photo added without a preview.');});
}
function sampleDraft(){
  var s=SAMPLES[S.sampleIdx++%SAMPLES.length];
  var src={};FIELD_KEYS.forEach(function(k){src[k]=s[k]?'label':'none';});
  var d=pick(s,FIELD_KEYS);
  d.photos=S.photos.slice();d.src=src;d.notes='';d.research=null;d.sampleKey=s.key;d.t=blankTasting();d.live=false;
  return d;
}
function finishScan(d){
  if(S.scanMode==='drink'){S.scanning=false;drinkFrom(d);return;}
  S.draft=d;S.scanning=false;S.dup=null;nav('review');}
function buildExamples(){
  return S.wines.filter(function(w){return w.fixed&&w.scanned&&w.photos&&w.photos[0]&&String(w.photos[0]).indexOf('data:image/jpeg')===0;})
    .sort(function(a,b){return (b.added||0)-(a.added||0);}).slice(0,3)
    .map(function(w){return {image:w.photos[0],wine:pick(w,FIELD_KEYS)};});
}
function startScan(){
  if(S.scanning)return;
  if(S.scanMode==='menu'){startMenu();return;}
  if(S.scanMode==='drink'&&!S.full.filter(Boolean).length){toast('Add a photo of the label first.');return;}
  S.scanning=true;var tok=++S.tok;
  render(true);
  var imgs=S.full.filter(Boolean);
  if(!imgs.length){
    setTimeout(function(){if(!S.scanning||tok!==S.tok)return;finishScan(sampleDraft());},1300);
    return;
  }
  var ctl=new AbortController();
  var timer=setTimeout(function(){ctl.abort();},60000);
  var headers={'Content-Type':'application/json'};
  if(S.pass)headers['x-passcode']=S.pass;
  var examples=buildExamples();
  idToken().then(function(idt){if(idt)headers['Authorization']='Bearer '+idt;return fetch('/api/scan',{method:'POST',headers:headers,body:JSON.stringify({images:imgs,examples:examples}),signal:ctl.signal});})
    .then(function(r){return r.json().catch(function(){return {};}).then(function(j){return {status:r.status,j:j};});})
    .then(function(x){
      clearTimeout(timer);
      if(!S.scanning||tok!==S.tok)return;
      if(x.status===200&&x.j&&x.j.wine){
        var d=pick(x.j.wine,FIELD_KEYS),src={};
        FIELD_KEYS.forEach(function(k){src[k]=d[k]?'label':'none';});
        var orig=pick(x.j.wine,FIELD_KEYS),unsureN=0;
        if(TYPES.indexOf(d.type)===-1){d.type='red';src.type='none';}
        orig.type=d.type;
        (Array.isArray(x.j.unsure)?x.j.unsure:[]).forEach(function(k){if(FIELD_KEYS.indexOf(k)!==-1&&d[k]&&src[k]==='label'){src[k]='unsure';unsureN++;}});
        d.photos=S.photos.slice();d.src=src;d.notes='';d.research=null;d.sampleKey='';d.t=blankTasting();d.live=true;d.orig=orig;d.used=examples.length;d.unsureN=unsureN;
        finishScan(d);
      }else if(x.status===503||x.status===404){
        toast('Label reading is not switched on yet. Showing a sample bottle.');
        finishScan(sampleDraft());
      }else if(x.status===401){
        S.scanning=false;toast(S.user?'Your sign-in expired. Reload the page and sign in again.':'Scan passcode needed or wrong. Set it under Tools on the Cellar page.');render(true);
      }else if(x.status===403){
        S.scanning=false;toast(x.j&&x.j.error==='unverified'?'Verify your email first. Check your inbox for the link, then tap I verified it on the Cellar page.':'This account is not approved to scan labels yet. Ask the owner to add your email.',9000);render(true);
      }else{
        S.scanning=false;toast('Could not read that label (status '+x.status+(x.j&&x.j.error?', '+x.j.error:'')+(x.j&&x.j.status?' '+x.j.status:'')+(x.j&&x.j.note?'; the model said: '+x.j.note:'')+'). Try a clearer photo, or use a sample bottle.',12000);render(true);
      }
    })
    .catch(function(err){
      clearTimeout(timer);
      if(!S.scanning||tok!==S.tok)return;
      S.scanning=false;toast('Could not reach the scan service ('+((err&&err.name)||'error')+'). Check your connection and try again.',9000);render(true);
    });
}


/* ---- Wine list ---- */
function menuKey(x){return norm(x).replace(/[^a-z0-9]/g,'');}
function menuMatch(it,pool){
  var n=menuKey(it.name),p=menuKey(it.producer),v=menuKey(it.vintage);
  if(!n)return null;
  return (pool||S.wines).filter(function(w){
    var wn=menuKey(w.name),wp=menuKey(w.producer),wv=menuKey(w.vintage);
    if(wn!==n&&!(p&&wn===menuKey(it.producer+' '+it.name))&&!(wp&&n===menuKey(w.producer+' '+w.name)))return false;
    if(p&&wp&&p!==wp)return false;
    if(v&&wv&&v!==wv)return false;
    return true;
  })[0]||null;
}

  if(!imgs.length){toast('Add a photo of the wine list first.');return;}

  var headers={'Content-Type':'application/json'};
  if(S.pass)headers['x-passcode']=S.pass;
  idToken().then(function(idt){if(idt)headers['Authorization']='Bearer '+idt;return fetch('/api/menu',{method:'POST',headers:headers,body:JSON.stringify({images:imgs}),signal:ctl.signal});})
    .then(function(r){return r.json().catch(function(){return {};}).then(function(j){return {status:r.status,j:j};});})

/* ---- Web lookup ---- */
function liveLookup(w,stillHere,after){
  var ctl=new AbortController();
  var timer=setTimeout(function(){ctl.abort();},90000);
  var headers={'Content-Type':'application/json'};
  if(S.pass)headers['x-passcode']=S.pass;
  var body=JSON.stringify({wine:pick(w,FIELD_KEYS)});
  idToken().then(function(idt){if(idt)headers['Authorization']='Bearer '+idt;return fetch('/api/lookup',{method:'POST',headers:headers,body:body,signal:ctl.signal});})
    .then(function(r){return r.json().catch(function(){return {};}).then(function(j){return {status:r.status,j:j};});})
    .then(function(x){
      clearTimeout(timer);
      S.looking=false;
      if(!stillHere())return;
      if(x.status===200&&x.j&&x.j.research){
        var r=x.j.research;
        if(!w.src)w.src={};
        var filled=0;
        ['grapes','region'].forEach(function(k){
          if(r[k]&&!(w[k]||'').trim()){w[k]=r[k];w.src[k]='researched';filled++;}
        });
        w.research={producer:r.producer||'',style:r.style||'',drink:r.drink||'',price:r.price||'',sources:Array.isArray(r.sources)?r.sources.slice(0,4):[]};
        if(after)after();
        toast(filled?'Lookup done. Filled '+filled+(filled===1?' empty field.':' empty fields.'):'Lookup done.');
      }else if(x.status===422){
        toast('The lookup found nothing reliable for this wine.',7000);
      }else if(x.status===503||x.status===404){
        toast('Web lookup is not switched on yet.');
      }else if(x.status===401){
        toast(S.user?'Your sign-in expired. Reload the page and sign in again.':'Passcode needed or wrong. Set it under Tools on the Cellar page.');
      }else if(x.status===403){
        toast('This account is not approved to use lookups yet.',7000);
      }else{
        toast('Lookup failed (status '+x.status+(x.j&&x.j.error?', '+x.j.error:'')+').',12000);
      }
      render(true);
    })
    .catch(function(err){
      clearTimeout(timer);
      S.looking=false;
      if(stillHere()){toast('Could not reach the lookup service ('+((err&&err.name)||'error')+'). Try again.',9000);render(true);}
    });
}

function parseDelimited(text){
  text=String(text||'').replace(/^﻿/,'');
  var first=(text.split(/\r?\n/)[0]||'').replace(/"[^"]*"/g,''),best=',',bc=-1;
  [',','\t',';','|'].forEach(function(d){var c=first.split(d).length-1;if(c>bc){bc=c;best=d;}});
  var rows=[],row=[],cell='',q=false,i,n=text.length,ch;
  for(i=0;i<n;i++){
    ch=text.charAt(i);
    if(q){
      if(ch==='"'){if(text.charAt(i+1)==='"'){cell+='"';i++;}else q=false;}
      else cell+=ch;
    }else if(ch==='"'&&cell==='')q=true;
    else if(ch===best){row.push(cell);cell='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text.charAt(i+1)==='\n')i++;row.push(cell);cell='';rows.push(row);row=[];}
    else cell+=ch;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  rows=rows.filter(function(r){return r.some(function(c){return String(c).trim()!=='';});});
  return {rows:rows,delim:best};

function buildImport(im){

  var dci=map.indexOf('date'),dorder=dci===-1?'':impDateOrder(rows.map(function(r){return r[dci];}));
  rows.forEach(function(r){
    var v={};IMP_KEYS.forEach(function(k){v[k]='';});
    map.forEach(function(f,ci){if(f&&!v[f])v[f]=String(r[ci]==null?'':r[ci]).replace(/\s+/g,' ').trim();});
    if(!v.name){noName++;return;}
    var w={name:v.name.slice(0,120),producer:v.producer.slice(0,120),vintage:impVintage(v.vintage),type:impType(v.type||''),grapes:v.grapes.slice(0,160),
      country:impCountry(v.country).slice(0,60),region:v.region.slice(0,80),appellation:v.appellation.slice(0,120),abv:impAbv(v.abv),volume:impVolume(v.volume),notes:v.wnotes.slice(0,280)};
    if(!w.country){var ic=inferCountry(w);if(ic){w.country=ic;w.countryInferred=true;}}
    var t={date:impDate(v.date,dorder),where:v.place.slice(0,120),taster:v.taster.slice(0,60),rating:impRating(v.rating),price:v.price.slice(0,40),notes:v.tnotes.slice(0,280)};
    var has=!!(t.date||t.where||t.taster||t.rating||t.price||t.notes);
    var rowQty=coll?(qi===-1?1:impQty(v.qty)):0;
    var wantRow=/want|wish|try|quiero|voglio|provare|probar|buy/i.test(v.status||'');
    var key=impKeyOf(w),g=groups[key];
    if(!g){g=groups[key]={wine:w,tastings:[],want:wantRow,seen:v.seen.slice(0,120),qty:0,tk:{}};order.push(key);}
    else if(wantRow&&!g.want&&!g.tastings.length&&!has){g.want=true;}
    else FIELD_KEYS.concat(['notes']).forEach(function(k){if(!g.wine[k]&&w[k])g.wine[k]=w[k];});
    g.qty+=rowQty;
    var tkey=[t.date,t.where,t.taster,t.rating,t.notes].join('|');
    if(has&&!(coll&&g.tk[tkey]))g.tastings.push(t);
    g.tk[tkey]=1;

  });
  var existing={};S.wines.forEach(function(w){existing[impKeyOf(w)]=w;});
  var fresh=[],dupes=0,newT=0,bottles=0;
  order.forEach(function(key){
    var g=groups[key],ex=existing[key],tk=function(t){return [t.date,t.where,t.taster,t.rating,t.notes].join('|');};

  'fill-countries':function(){

    list.forEach(function(w){
      var c=inferCountry(w);

    });
    var finish=function(extra){
      S.filling=false;persist();
      toast('Filled in '+(done+extra)+(done+extra===1?' country':' countries')+(left.length-extra>0?'. '+(left.length-extra)+' left blank because the region did not point to one country.':'.'),8000);
      render(true);
    };
    if(!left.length){finish(0);return;}
    S.filling=true;render(true);
    var items=left.slice(0,60).map(function(w){return {region:w.region||'',appellation:w.appellation||'',name:w.name||'',producer:w.producer||''};});
    var headers={'Content-Type':'application/json'};
    if(S.pass)headers['x-passcode']=S.pass;
    idToken().then(function(idt){if(idt)headers['Authorization']='Bearer '+idt;return fetch('/api/countries',{method:'POST',headers:headers,body:JSON.stringify({items:items})});})
      .then(function(r){return r.json().catch(function(){return {};}).then(function(j){return {status:r.status,j:j};});})
      .then(function(x){
        var extra=0;

          x.j.countries.forEach(function(c,i){

            if(w&&typeof c==='string'&&c.trim()&&!(w.country||'').trim()){w.country=c.trim().slice(0,40);w.src=w.src||{};w.src.country='inferred';extra++;}
          });
        }
        finish(extra);
      })
      .catch(function(){finish(0);});
  },

function bindSet(path,val){
  var parts=path.split('.'),root=parts[0],key=parts[1],obj=null;
  if(root==='a'){S.a[key]=val;return;}
  if(root==='menuPlace'){S.menuPlace=val;return;}
  if(root==='p'){S.pass=val;try{localStorage.setItem('bottle-notes-pass',val);}catch(e){}return;}
  if(root==='d')obj=S.draft;else if(root==='t')obj=S.draft&&S.draft.t;else if(root==='nt')obj=S.nt;
  if(!obj)return;
  obj[key]=val;
  if(root==='d'&&FIELD_KEYS.indexOf(key)!==-1&&S.draft.src){
    var cur=S.draft.src[key]||'none';
    if(cur!=='edited'&&cur!=='manual'){S.draft.src[key]=(cur==='none')?'manual':'edited';refreshTag(key);}
  }
  if(key==='notes'){var c=document.getElementById(root+'-count');if(c)c.textContent=val.length+'/280';}
}
function onBind(e){
  var t=e.target;
  if(t.hasAttribute&&t.hasAttribute('data-search')){
    S.q=t.value;
    var box=document.getElementById('results');

  if(t.hasAttribute&&t.hasAttribute('data-dsearch')){
    if(S.drink){S.drink.q=t.value;var db=document.getElementById('dresults');if(db)db.innerHTML=drinkListHtml();}
    return;
  }
  var path=t.getAttribute&&t.getAttribute('data-bind');
  if(path)bindSet(path,t.value);
}

/* ---- Accounts and cloud cellar ---- */
var C={m:null,auth:null,db:null,snap:{},chain:Promise.resolve(),on:false};
var IMPORT_FLAG='bottle-notes-import-done';
function idToken(){
  var u=C.auth&&C.auth.currentUser;
  if(!C.on||!u)return Promise.resolve('');
  return u.getIdToken().catch(function(){return '';});
}
function notifyJoin(u){
  /* New accounts tell the owner once. The server decides whether to email; this just avoids repeat calls. */
  try{
    var flag='bottle-notes-joined-'+u.uid;
    if(localStorage.getItem(flag))return;
    var made=Date.parse(u.metadata&&u.metadata.creationTime);
    if(!made||Date.now()-made>15*60*1000){localStorage.setItem(flag,'1');return;}
    idToken().then(function(t){
      if(!t)return;
      return fetch('/api/joined',{method:'POST',headers:{'Authorization':'Bearer '+t}}).then(function(r){
        if(r.ok||r.status===503)try{localStorage.setItem(flag,'1');}catch(e){}
      });
    }).catch(function(){});
  }catch(e){}
}
function importDone(){try{localStorage.setItem(IMPORT_FLAG,'1');}catch(e){}}
function importCard(){
  var n=S.importLocal?S.importLocal.length:0;
  if(!n)return '';
  return '<div class="notice"><p><strong>Wines found in this browser.</strong> Copy '+n+(n===1?' wine':' wines')+' into your account?</p><div class="trow" style="margin-top:8px"><button class="btn btn-primary" data-act="import-yes">Import them</button><button class="btn" data-act="import-no">No thanks</button></div></div>';
}
function verifyCard(){
  var u=C.auth&&C.auth.currentUser;
  if(!u||u.emailVerified)return '';
  return '<div class="notice"><p><strong>Verify your email.</strong> We sent a link to '+esc(u.email||'')+'. Scanning needs a verified email.</p><div class="trow" style="margin-top:8px"><button class="btn btn-primary" data-act="verify-check">I verified it</button><button class="btn" data-act="verify-resend">Send again</button></div></div>';
}
function authMsg(e){
  var c=(e&&e.code)||'';
  var m={
    'auth/invalid-credential':'That email and password do not match.',
    'auth/wrong-password':'That email and password do not match.',
    'auth/user-not-found':'That email and password do not match.',
    'auth/invalid-email':'That email address does not look right.',
    'auth/email-already-in-use':'That email already has an account. Try signing in.',
    'auth/weak-password':'Use at least 6 characters for the password.',
    'auth/missing-password':'Type your password.',
    'auth/too-many-requests':'Too many tries. Wait a few minutes and try again.',
    'auth/network-request-failed':'No connection. Check your internet and try again.',
    'auth/operation-not-allowed':'That sign-in method is not switched on in Firebase yet.',
    'auth/unauthorized-domain':'This site address is not on the Firebase authorized domains list yet.',
    'auth/popup-blocked':'Your browser blocked the Google window. Allow pop-ups and try again.',
    'auth/popup-closed-by-user':'',
    'auth/cancelled-popup-request':''
  };
  return Object.prototype.hasOwnProperty.call(m,c)?m[c]:'Could not sign in ('+(c||'error')+').';
}
function authGo(fn){
  if(S.a.busy)return;
  S.a.busy=true;S.a.err='';S.a.info='';render(true);
  var p;try{p=Promise.resolve(fn());}catch(e){p=Promise.reject(e);}
  p.catch(function(e){S.a.err=authMsg(e);}).then(function(){S.a.busy=false;if(S.cloud==='auth')render(true);});
}

function submitAuth(){
  var ee=document.getElementById('a-email'),pe=document.getElementById('a-pw');
  if(ee)S.a.email=ee.value;if(pe)S.a.pw=pe.value;
  var email=S.a.email.trim(),pw=S.a.pw;
  if(!email||!pw){S.a.err='Type your email and password.';render(true);return;}
  authGo(function(){
    var A=C.m.auth;
    if(S.a.mode==='up')return A.createUserWithEmailAndPassword(C.auth,email,pw).then(function(cred){return A.sendEmailVerification(cred.user).catch(function(){});});
    return A.signInWithEmailAndPassword(C.auth,email,pw);
  });

function cloudSync(){
  var F=C.m.fs,uid=S.user.uid,cur={},ops=[];
  S.wines.forEach(function(w){cur[w.id]=JSON.stringify(w);});
  S.wines.forEach(function(w){if(C.snap[w.id]!==cur[w.id])ops.push({id:w.id,json:cur[w.id]});});
  Object.keys(C.snap).forEach(function(id){if(!(id in cur))ops.push({id:id,del:true});});
  if(!ops.length)return;
  C.chain=C.chain.then(function(){
    return Promise.all(ops.map(function(o){
      var ref=F.doc(C.db,'users',uid,'wines',o.id);
      var p=o.del?F.deleteDoc(ref):F.setDoc(ref,JSON.parse(o.json));
      return p.then(function(){if(o.del)delete C.snap[o.id];else C.snap[o.id]=o.json;});
    }));
  }).catch(function(){toast('Could not save to your account. Check your connection. It will try again on your next change.',7000);});
}
function loadCloud(uid){
  var F=C.m.fs;
  return F.getDocs(F.collection(C.db,'users',uid,'wines')).then(function(q){
    var list=[];C.snap={};
    q.forEach(function(d){var w=d.data();if(!w.id)w.id=d.id;if(!Array.isArray(w.tastings))w.tastings=[];list.push(w);C.snap[w.id]=JSON.stringify(w);});
    list.sort(function(a,b){return (b.added||0)-(a.added||0);});
    S.wines=list;
  });
}
function localLeftovers(){
  var done=false;try{done=!!localStorage.getItem(IMPORT_FLAG);}catch(e){}
  if(done)return null;
  var saved=null;try{saved=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!Array.isArray(saved))return null;
  var mine=saved.filter(function(w){return w&&!w.example&&w.id;});
  return mine.length?mine:null;
}
function onUser(u){
  if(!u){
    C.on=false;S.user=null;S.wines=[];S.sel=null;S.draft=null;S.importLocal=null;C.snap={};S.view='list';histReset();S.q='';S.type='all';
    S.a.pw='';S.cloud='auth';render(false);return;
  }
  S.user=u;S.cloud='loading';render(false);
  loadCloud(u.uid).then(function(){
    C.on=true;
    var left=localLeftovers();
    S.importLocal=(left&&!S.wines.length)?left:null;
    if(left&&S.wines.length)importDone();
    S.cloud='ready';S.view='list';histReset();render(false);window.scrollTo(0,0);
    notifyJoin(u);
  }).catch(function(e){
    C.on=false;S.cloud='error';
    S.a.err=(e&&e.code==='permission-denied')?'Your account could not open its cellar. The database rules may not be published yet.':'Could not load your cellar ('+((e&&e.code)||'error')+'). Check your connection and try again.';
    render(false);
  });
}
function startLocal(){
  var saved=null;
  try{saved=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  S.wines=Array.isArray(saved)?saved:seeds();
  try{S.pass=localStorage.getItem('bottle-notes-pass')||'';}catch(e){}
  S.cloud='off';render(false);
}
function startCloud(cfg){
  var B='https://www.gstatic.com/firebasejs/10.14.1/';
  var sdk=window.__sdk?Promise.resolve([window.__sdk.app,window.__sdk.auth,window.__sdk.fs]):Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  return sdk.then(function(m){
    var a=m[0].initializeApp(cfg);
    C.m={app:m[0],auth:m[1],fs:m[2]};
    C.auth=m[1].getAuth(a);C.db=m[2].getFirestore(a);
    m[1].onAuthStateChanged(C.auth,onUser);
  });
}
app.addEventListener('submit',function(e){
  if(e.target&&e.target.hasAttribute&&e.target.hasAttribute('data-auth')){e.preventDefault();submitAuth();}
});

render(false);
fetch('/api/config',{cache:'no-store'})
  .then(function(r){return r.ok?r.json():null;})
  .catch(function(){return null;})
  .then(function(cfg){
    if(!cfg||!cfg.apiKey||!cfg.projectId){startLocal();return;}
    return startCloud(cfg).catch(function(){S.cloud='error';S.a.err='Could not load the sign-in service. Check your connection and try again.';render(false);});
  });
})();
